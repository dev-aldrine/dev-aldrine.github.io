<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Portfolio Temporarily Down</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background: #0d0d0f;
      color: #e6e6e6;
      font-family: "Consolas", "Courier New", monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 24px;
      text-align: center;
    }

    .message-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Glitch text */
    .glitch {
      position: relative;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      letter-spacing: 0.5px;
    }

    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0d0d0f;
      overflow: hidden;
    }

    .glitch::before {
      color: #ff3b6b;
      animation: glitch-shift 2.6s infinite linear alternate-reverse;
      clip-path: inset(20% 0 60% 0);
    }

    .glitch::after {
      color: #3bd6ff;
      animation: glitch-shift 3.1s infinite linear alternate;
      clip-path: inset(60% 0 15% 0);
    }

    @keyframes glitch-shift {
      0%   { transform: translate(0); clip-path: inset(40% 0 45% 0); }
      10%  { transform: translate(-3px, 1px); clip-path: inset(10% 0 80% 0); }
      20%  { transform: translate(3px, -1px); clip-path: inset(70% 0 10% 0); }
      30%  { transform: translate(-2px, 2px); clip-path: inset(30% 0 55% 0); }
      40%  { transform: translate(2px, -2px); clip-path: inset(85% 0 5% 0); }
      50%  { transform: translate(-3px, 0); clip-path: inset(50% 0 35% 0); }
      60%  { transform: translate(3px, 1px); clip-path: inset(15% 0 70% 0); }
      70%  { transform: translate(-1px, -1px); clip-path: inset(65% 0 20% 0); }
      80%  { transform: translate(2px, 2px); clip-path: inset(25% 0 60% 0); }
      90%  { transform: translate(-2px, -2px); clip-path: inset(75% 0 10% 0); }
      100% { transform: translate(0); clip-path: inset(45% 0 40% 0); }
    }

    /* Loading spinner */
    .spinner {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      border: 3px solid rgba(230, 230, 230, 0.15);
      border-top-color: #3bd6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Progress bar */
    .progress-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: min(420px, 80vw);
    }

    .progress-track {
      position: relative;
      width: 100%;
      height: 14px;
      background: rgba(230, 230, 230, 0.08);
      border: 1px solid rgba(230, 230, 230, 0.2);
      border-radius: 7px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 56%;
      background: linear-gradient(90deg, #ff3b6b, #3bd6ff);
      border-radius: 7px;
      animation: stuck 2.4s ease-in-out infinite alternate,
                 bar-glitch 1.7s steps(2, jump-none) infinite;
    }

    @keyframes stuck {
      from { width: 56%; }
      to   { width: 67%; }
    }

    @keyframes bar-glitch {
      0%, 88%, 100% { transform: translate(0); filter: none; opacity: 1; }
      90% { transform: translateX(-3px) skewX(-8deg); filter: hue-rotate(60deg); opacity: 0.7; }
      92% { transform: translateX(4px) skewX(10deg); filter: hue-rotate(-90deg); }
      94% { transform: translateX(-2px); opacity: 0.5; }
      96% { transform: translateX(2px) skewX(-5deg); filter: hue-rotate(120deg); opacity: 0.9; }
    }

    .progress-label {
      font-size: 0.85rem;
      color: #9a9aa3;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="message-row">
      <div class="spinner" aria-hidden="true"></div>
      <span class="glitch" data-text="Portfolio Temporarily Down, Server 404. Will rebuild later...">Portfolio Temporarily Down, Server 404. Will rebuild later...</span>
    </div>

    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-fill" id="fill"></div>
      </div>
      <div class="progress-label">Rebuilding... <span id="pct">56</span>%</div>
    </div>
  </div>

  <script>
    // Keep the % label in sync with the 56% <-> 67% oscillating bar.
    const pct = document.getElementById('pct');
    const fill = document.getElementById('fill');
    setInterval(() => {
      pct.textContent = Math.round((fill.offsetWidth / fill.parentElement.offsetWidth) * 100);
    }, 100);
  </script>
</body>
</html>
